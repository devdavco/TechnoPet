<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Techno Pet - Catálogo</title>
    <!-- FAVICON -->
    <link rel="icon" href="./assets/favicon/favicon.ico" sizes="any" />
    <link rel="icon" href="./assets/favicon/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/favicon/apple-touch-icon.png" />
    <link rel="stylesheet" href="./css/style.css" />

    <!-- BOOTSTRAP 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- BOOTSTRAP ICONS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <!-- CATÁLOGO -->
    <link rel="stylesheet" href="./css/catalog-search.css" />
    <link rel="stylesheet" href="./css/catalog-header.css" />
    <link rel="stylesheet" href="./css/catalog-pagination.css" />
  </head>
  <body class="d-flex flex-column min-vh-100 bg-white">
    <!-- HEADER -->
    <div id="header-component"></div>
    <catalog-search></catalog-search>
    <main class="container flex-grow-1">
      <catalog-header></catalog-header>
      <product-list id="listado-productos"></product-list>
      <catalog-pagination></catalog-pagination>
    </main>

    <!-- MAIN CONTENT -->
    <main class="container my-4 flex-grow-1">
      <div class="mb-4">
        <h1 class="fw-bold mb-1">Catálogo de productos</h1>
        <p class="text-secondary small">
          Encuentra tecnología para la alimentación, seguridad y bienestar de tu mascota con sincronización IoT en tiempo real.
        </p>
      </div>

      <!-- CONTENEDOR DE PRODUCTOS -->
      <div class="row g-3" id="catalog-container"></div>
    </main>

    <!-- FOOTER -->
    <div id="footer-component"></div>

    <!-- SCRIPTS EN ORDEN CORRECTO -->
    <script src="./scripts/logo/logo-full.js"></script>
    <script src="./scripts/components.js"></script>

    <!-- CARGA DIRECTA DE COMPONENTES DE PRODUCTOS (SIN DEFER) -->
    <script src="./scripts/pages/products/product-card.js"></script>
    <script src="./scripts/pages/products/product-list.js"></script>

    <!-- CATÁLOGO -->
    <script src="./services/api_products.js" defer></script>
    <script src="./scripts/pages/products/catalog-state.js" defer></script>
    <script src="./scripts/pages/products/catalog-search.js" defer></script>
    <script src="./scripts/pages/products/catalog-header.js" defer></script>
    <script src="./scripts/pages/products/product-list-temp.js" defer></script>
    <script src="./scripts/pages/products/catalog-pagination.js" defer></script>

    <!-- BOOTSTRAP JAVASCRIPT -->
    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
