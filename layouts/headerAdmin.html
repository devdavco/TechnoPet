<header class="bg-white border-bottom py-3 sticky-top">
  <div class="container d-flex flex-wrap justify-content-between align-items-center gap-3">
    <!-- Logo y sección actual -->
    <div class="d-flex align-items-center gap-3">
      <a href="./index.html" aria-label="Ir al inicio de Techno Pet">
        <logo-full></logo-full>
      </a>
      <span class="badge rounded-pill badge-container color-primary fw-semibold">Admin</span>
    </div>

    <!-- Buscador, ir a la tienda y cerrar sesión -->
    <div class="d-flex flex-wrap align-items-center gap-2 admin-header-actions">
      <!-- Lo usa main.js para filtrar la lista de productos -->
      <div class="input-group input-group-sm admin-search">
        <span class="input-group-text bg-light text-secondary">
          <i class="bi bi-search" aria-hidden="true"></i>
        </span>
        <input
          type="search"
          id="admin-search"
          class="form-control bg-light"
          placeholder="Buscar productos..."
          aria-label="Buscar productos"
        />
      </div>
      <a href="./index.html" class="btn btn-outline-dark btn-sm">
        <i class="bi bi-shop me-1" aria-hidden="true"></i>Ver tienda
      </a>
      <session-menu modo="admin"></session-menu>
    </div>
  </div>
</header>
